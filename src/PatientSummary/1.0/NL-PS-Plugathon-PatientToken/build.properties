input.dir = src/PatientSummary/1.0/NL-PS-Plugathon-PatientToken
output.dir = output/R4/PatientSummary/1.0/NL-PS-Plugathon-PatientToken
informationStandard = Patient Summary
goal = Test
serverAlias = nictiz
components.dir = src/PatientSummary/1.0/_components

fhir.version = R4
# hl7.fhir.uv.ips 2.0.1 is added on purpose. nictiz.nl.nlps loads IPS 2.0.0 through
# hl7.fhir.eu.eps 1.0.0-ballot. In IPS 2.0.0, Patient-uv-ips refers to the extensions
# individual-genderIdentity and individual-pronouns version 5.3.0-ballot-tc1, which are
# not loaded. IPS 2.0.1 refers to version 5.3.0. Remove this when EPS depends on IPS 2.0.1.
packages = nictiz.nl.nlps, hl7.fhir.uv.ips
package.nictiz.nl.nlps = 1.0.0-alpha.2
package.hl7.fhir.uv.ips = 2.0.1

